name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit and statistical tests
        # These build their own small dataset in memory - no warehouse needed.
        run: pytest -q --durations=10

      - name: Build the warehouse and run the full pipeline
        run: python -m retailpulse all

      - name: End-to-end tests against the real warehouse
        # Now that the warehouse exists, the dashboard and pipeline tests run
        # instead of skipping.
        run: pytest -q -m "slow or not slow"

      - name: Executive summary
        if: always()
        run: cat reports/EXECUTIVE_SUMMARY.md >> $GITHUB_STEP_SUMMARY

      - name: Upload pipeline outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs-py${{ matrix.python-version }}
          path: |
            reports/
            data/outputs/
          retention-days: 7
